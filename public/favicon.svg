    <!-- Glitch Blocks -->
    <rect x="3" y="40" width="12" height="8" fill="#1A3B5C" />
    <rect x="22" y="65" width="8" height="8" fill="#1A3B5C" />
    <rect x="85" y="35" width="10" height="8" fill="#38B2A5" />
    <rect x="73" y="60" width="12" height="8" fill="#38B2A5" />
